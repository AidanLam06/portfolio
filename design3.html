<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeebStudio</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
<style>
  :root{
    --bg: #0c0d10;
    --panel: #16181d;
    --panel-2: #1d2027;
    --line: #2a2d35;
    --text: #e9e7e2;
    --muted: #8b8e96;
    --accent: #7c5cfc;
    --accent-dim: #4a3a99;
    --amber: #f0a83e;
    --linear: #d13b3b;
    --tactile: #c9822f;
    --clicky: #3b7fd1;
    --silent: #59595c;
    --he: #34c2a3;
    --radius: 10px;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --sans: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;

    --topbar-grad-1: #121317;
    --topbar-grad-2: #0f1013;
    --key-grad-1: #26282f;
    --key-grad-2: #17181c;
    --key-shadow: #0a0a0c;
    --visual-grad-1: #1e2027;
    --visual-grad-2: #131418;
    --keycap-grad-1: #2c2f38;
    --keycap-grad-2: #191a1f;
    --keycap-border: #34363f;
    --toast-bg: #171820;
  }

  :root[data-theme="light"]{
    --bg: #f4f3f1;
    --panel: #ffffff;
    --panel-2: #f0efec;
    --line: #e1ded8;
    --text: #1c1c1e;
    --muted: #6b6e76;
    --accent: #6d4ee8;
    --accent-dim: #5439bd;
    --amber: #b5730a;
    --linear: #c0392b;
    --tactile: #a5651c;
    --clicky: #2b64a8;
    --silent: #6b6d72;
    --he: #1f9376;

    --topbar-grad-1: #ffffff;
    --topbar-grad-2: #f7f6f3;
    --key-grad-1: #ece9e4;
    --key-grad-2: #ddd9d2;
    --key-shadow: #c9c5bd;
    --visual-grad-1: #ece9e4;
    --visual-grad-2: #ddd9d2;
    --keycap-grad-1: #ffffff;
    --keycap-grad-2: #eeece8;
    --keycap-border: #d8d4cd;
    --toast-bg: #ffffff;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--accent-dim); color:#fff; }

  a{ color:inherit; }

  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 28px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--topbar-grad-1), var(--topbar-grad-2));
    position:sticky;
    top:0;
    z-index:20;
  }

  .brandmark{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--mono);
    font-weight:700;
    font-size:20px;
    letter-spacing:0.5px;
  }

  .brandmark .key{
    width:26px;height:26px;
    border-radius:5px;
    background:linear-gradient(160deg, var(--key-grad-1), var(--key-grad-2));
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--accent);
    box-shadow: 0 2px 0 var(--key-shadow), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  .brandmark .studio{ color:var(--muted); font-weight:400; }

  .topbar-tag{
    font-size:12px;
    color:var(--muted);
    font-family:var(--mono);
    letter-spacing:1px;
    text-transform:uppercase;
  }

  .topbar-right{
    display:flex;
    align-items:center;
    gap:20px;
  }

  .cart-btn{
    position:relative;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:16px;
    padding:8px 14px;
    border-radius:9px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .cart-btn:hover{ border-color:var(--accent); }

  .cart-count{
    font-family:var(--mono);
    font-size:11px;
    background:var(--accent);
    color:#fff;
    border-radius:20px;
    padding:1px 7px;
    min-width:16px;
    text-align:center;
  }

  .theme-toggle{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:12.5px;
    padding:8px 14px;
    border-radius:9px;
    cursor:pointer;
    font-family:var(--mono);
  }
  .theme-toggle:hover{ border-color:var(--accent); }

  .survey-promo{
    display:flex;
    align-items:center;
    gap:7px;
    background:linear-gradient(135deg, rgba(124,92,252,0.18), rgba(240,168,62,0.12));
    border:1px solid var(--accent);
    color:var(--text);
    font-size:12.5px;
    padding:8px 14px;
    border-radius:9px;
    cursor:pointer;
    font-family:var(--sans);
    white-space:nowrap;
    line-height:1.2;
  }
  .survey-promo:hover{ border-color:var(--amber); }
  .survey-promo strong{ color:var(--amber); }

  .layout{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:0;
    min-height:calc(100vh - 66px);
  }

  aside.sidebar{
    border-right:1px solid var(--line);
    padding:24px 20px 60px;
    background:var(--panel);
  }

  .filter-group{
    margin-bottom:28px;
  }

  .filter-group h3{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--amber);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .filter-group h3::before{
    content:'';
    width:6px;height:6px;
    background:var(--amber);
    border-radius:1px;
    transform:rotate(45deg);
    display:inline-block;
  }

  .check-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:6px 0;
    font-size:13.5px;
    cursor:pointer;
    color:var(--text);
    user-select:none;
  }

  .check-row:hover{ color:var(--amber); }

  .check-row input[type="checkbox"]{
    appearance:none;
    -webkit-appearance:none;
    width:16px;height:16px;
    border:1px solid var(--line);
    background:var(--panel-2);
    border-radius:4px;
    margin:0 10px 0 0;
    position:relative;
    cursor:pointer;
    flex-shrink:0;
    top:1px;
  }

  .check-row input[type="checkbox"]:checked{
    background:var(--accent);
    border-color:var(--accent);
  }

  .check-row input[type="checkbox"]:checked::after{
    content:'';
    position:absolute;
    left:5px; top:2px;
    width:4px; height:8px;
    border:solid #0c0d10;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }

  .row-label{
    display:flex;
    align-items:center;
    flex:1;
  }

  .swatch{
    width:9px;height:9px;
    border-radius:50%;
    margin-right:8px;
    flex-shrink:0;
  }

  .count-pill{
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
    background:var(--panel-2);
    padding:1px 6px;
    border-radius:20px;
    border:1px solid var(--line);
  }

  .brand-search{
    width:100%;
    padding:8px 10px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:7px;
    color:var(--text);
    font-size:13px;
    margin-bottom:10px;
    font-family:var(--sans);
  }

  .brand-search:focus{
    outline:none;
    border-color:var(--accent);
  }

  .brand-list{
    max-height:220px;
    overflow-y:auto;
    padding-right:4px;
  }

  .brand-list::-webkit-scrollbar{ width:6px; }
  .brand-list::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  .no-brand-match{
    font-size:12.5px;
    color:var(--muted);
    padding:8px 0;
    font-style:italic;
  }

  .clear-btn{
    width:100%;
    padding:9px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:7px;
    font-size:12.5px;
    cursor:pointer;
    font-family:var(--mono);
    letter-spacing:0.5px;
    margin-top:6px;
  }
  .clear-btn:hover{ border-color:var(--accent); color:var(--accent); }

  main.content{
    padding:26px 24px 60px;
  }

  .content-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:8px;
  }

  .content-header h1{
    font-size:22px;
    margin:0;
    font-weight:600;
  }

  .result-count{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--muted);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(360px, 1fr));
    gap:28px;
  }

  @media (min-width:1100px){
    .grid{
      grid-template-columns:repeat(2, 1fr);
    }
  }

  @media (min-width:1500px){
    .grid{
      grid-template-columns:repeat(3, 1fr);
    }
  }

  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:70px 20px;
    color:var(--muted);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    font-size:14px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:24px;
    cursor:pointer;
    transition:transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
  }

  .card-visual{
    height:210px;
    border-radius:12px;
    background:
      radial-gradient(120% 100% at 50% -10%, rgba(255,255,255,0.05), transparent 60%),
      linear-gradient(160deg, var(--visual-grad-1), var(--visual-grad-2));
    border:1px solid var(--line);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .keycap-illustration{
    width:140px;
    height:104px;
    border-radius:10px 10px 20px 20px;
    background:linear-gradient(160deg, var(--keycap-grad-1), var(--keycap-grad-2));
    border:1px solid var(--keycap-border);
    box-shadow:0 6px 0 rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.06);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .keycap-illustration .legend{
    font-family:var(--mono);
    font-size:13px;
    color:var(--muted);
    letter-spacing:1.5px;
  }

  .switch-dot{
    position:absolute;
    top:14px; left:14px;
    width:16px;height:16px;
    border-radius:50%;
    border:2px solid rgba(0,0,0,0.3);
  }

  .card-img{
    width:100%; height:100%;
    object-fit:cover;
    border-radius:10px;
  }

  .card-body{ display:flex; flex-direction:column; gap:4px; }

  .card-brand{
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--muted);
    font-family:var(--mono);
  }

  .card-name{
    font-size:21px;
    font-weight:600;
    color:var(--text);
  }

  .card-meta{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:6px;
  }

  .badge{
    font-size:12px;
    font-family:var(--mono);
    padding:4px 11px;
    border-radius:20px;
    border:1px solid var(--line);
    color:var(--muted);
    background:var(--panel-2);
  }

  .card-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }

  .price{
    font-family:var(--mono);
    font-weight:700;
    color:var(--amber);
    font-size:22px;
  }

  .view-link{
    font-size:13px;
    color:var(--accent);
    font-family:var(--mono);
  }

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(6,6,8,0.72);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }

  .modal-overlay.open{ display:flex; }

  .modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    max-width:640px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    padding:0;
    position:relative;
    box-shadow:0 30px 60px rgba(0,0,0,0.5);
  }

  .modal-close{
    position:absolute;
    top:16px; right:16px;
    width:32px;height:32px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    cursor:pointer;
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    z-index:2;
  }
  .modal-close:hover{ border-color:var(--accent); color:var(--accent); }

  .modal-visual{
    background:
      radial-gradient(120% 140% at 50% -10%, rgba(124,92,252,0.15), transparent 60%),
      linear-gradient(160deg, var(--visual-grad-1), var(--visual-grad-2));
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:16px 16px 0 0;
    position:relative;
    overflow:hidden;
  }

  .modal-visual.placeholder{
    height:200px;
  }

  .modal-img{
    display:block;
    width:100%;
    height:auto;
    max-height:70vh;
    object-fit:contain;
    border-radius:16px 16px 0 0;
  }

  .modal-visual .keycap-illustration{
    width:130px; height:96px;
    border-radius:10px 10px 20px 20px;
  }

  .modal-body{
    padding:26px 28px 30px;
  }

  .modal-brand{
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:1.5px;
  }

  .modal-title{
    font-size:24px;
    font-weight:700;
    margin:4px 0 14px;
  }

  .spec-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin:18px 0;
  }

  .spec-box{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:9px;
    padding:10px 12px;
  }

  .spec-box .label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
    font-family:var(--mono);
    margin-bottom:4px;
  }

  .spec-box .value{
    font-size:14px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:6px;
  }

  .feature-list{
    list-style:none;
    padding:0;
    margin:16px 0 22px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .feature-list li{
    font-size:13.5px;
    color:var(--text);
    display:flex;
    align-items:flex-start;
    gap:8px;
  }

  .feature-list li::before{
    content:'▸';
    color:var(--accent);
    flex-shrink:0;
  }

  .modal-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding-top:18px;
    border-top:1px solid var(--line);
  }

  .modal-price{
    font-family:var(--mono);
    font-size:24px;
    font-weight:700;
    color:var(--amber);
  }

  .add-cart-btn{
    background:linear-gradient(160deg, var(--accent), var(--accent-dim));
    border:none;
    color:#fff;
    padding:12px 22px;
    border-radius:9px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(124,92,252,0.35);
    transition:transform 0.12s ease;
  }
  .add-cart-btn:hover{ transform:translateY(-1px); }
  .add-cart-btn:active{ transform:translateY(0); }

  .toast{
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--toast-bg);
    border:1px solid var(--accent);
    color:var(--text);
    padding:12px 20px;
    border-radius:9px;
    font-size:13.5px;
    font-family:var(--mono);
    opacity:0;
    pointer-events:none;
    transition:all 0.25s ease;
    z-index:200;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (max-width:820px){
    .layout{ grid-template-columns:1fr; }
    aside.sidebar{ border-right:none; border-bottom:1px solid var(--line); }
    .spec-grid{ grid-template-columns:repeat(2,1fr); }
  }

  /* ---------- Cart / Checkout ---------- */
  .checkout-modal{
    max-width:820px;
  }

  .checkout-body{
    padding:32px 28px 34px;
    max-width:560px;
    margin:0 auto;
  }

  .checkout-steps{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:24px;
  }

  .checkout-step{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:0.5px;
  }

  .checkout-step .dot{
    width:22px;height:22px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
    flex-shrink:0;
  }

  .checkout-step.active{ color:var(--text); }
  .checkout-step.active .dot{ border-color:var(--accent); background:var(--accent); color:#fff; }
  .checkout-step.done .dot{ border-color:var(--he); background:var(--he); color:#0c0d10; }

  .checkout-step-line{
    flex:1;
    height:1px;
    background:var(--line);
    margin:0 2px;
  }

  .checkout-title{
    font-size:20px;
    font-weight:700;
    margin:0 0 18px;
  }

  .cart-line{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }

  .cart-line-visual{
    width:56px;height:56px;
    border-radius:8px;
    background:linear-gradient(160deg, var(--visual-grad-1), var(--visual-grad-2));
    border:1px solid var(--line);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }

  .cart-line-visual img{
    width:100%;height:100%;
    object-fit:cover;
  }

  .cart-line-info{ flex:1; min-width:0; }
  .cart-line-name{ font-size:14.5px; font-weight:600; }
  .cart-line-brand{ font-size:11.5px; color:var(--muted); font-family:var(--mono); }

  .qty-control{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .qty-btn{
    width:24px;height:24px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    cursor:pointer;
    font-size:13px;
    display:flex;align-items:center;justify-content:center;
  }
  .qty-btn:hover{ border-color:var(--accent); color:var(--accent); }

  .qty-value{
    font-family:var(--mono);
    font-size:13px;
    min-width:16px;
    text-align:center;
  }

  .cart-line-price{
    font-family:var(--mono);
    font-weight:700;
    color:var(--amber);
    font-size:14px;
    min-width:60px;
    text-align:right;
  }

  .remove-line{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:15px;
    padding:2px 4px;
  }
  .remove-line:hover{ color:var(--linear); }

  .cart-empty{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
    font-size:14px;
  }

  .cart-summary{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:16px;
    margin-top:4px;
  }

  .cart-summary .label{ color:var(--muted); font-size:13.5px; }
  .cart-summary .value{ font-family:var(--mono); font-weight:700; font-size:20px; color:var(--amber); }

  .checkout-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;

};

// All prices in KEYBOARDS/SHIPPING_FEE are stored in CAD. This is a fixed demo
// rate (not live) used purely to convert the displayed number when the user
// toggles to USD.
const CAD_TO_USD_RATE = 0.73;

function formatPrice(amountCAD, currency) {
  const amount = currency === "USD" ? Math.round(amountCAD * CAD_TO_USD_RATE) : Math.round(amountCAD);
  return currency === "USD" ? `US$${amount}` : `C$${amount}`;
}

/* ---------------------------------------------------
   2. SMALL PRESENTATIONAL HELPERS
--------------------------------------------------- */

function CardVisual({ kb }) {
  if (kb.imageUrl) {
    return <img className="card-img" src={kb.imageUrl} alt={kb.name} />;
  }
  return (
    <React.Fragment>
      <span className="switch-dot" style={{ background: SWITCH_COLORS[kb.switchType] }}></span>
      <div className="keycap-illustration"><span className="legend">{kb.layout}</span></div>
    </React.Fragment>
  );
}

function ProductCard({ kb, onSelect, currency }) {
  return (
    <div className="card" onClick={() => onSelect(kb.id)}>
      <div className="card-visual"><CardVisual kb={kb} /></div>
      <div className="card-body">
        <div className="card-brand">{kb.brand}</div>
        <div className="card-name">{kb.name}</div>
        <div className="card-meta">
          <span className="badge">{kb.layout}</span>
          <span className="badge">{kb.switchType}</span>
        </div>
      </div>
      <div className="card-footer">
        <span className="price">{formatPrice(kb.price, currency)}</span>
        <span className="view-link">View details →</span>
      </div>

/* ---------------------------------------------------
   3. SIDEBAR / FACETED SEARCH
--------------------------------------------------- */

function Sidebar({
  layoutFilters, switchFilters, brandFilters, brandSearch, brandCounts,
  onToggleLayout, onToggleSwitch, onToggleBrand, onBrandSearchChange, onClear
}) {
  const allBrands = useMemo(
    () => [...new Set(KEYBOARDS.map(k => k.brand))].sort(),
    []
  );
  const visibleBrands = allBrands.filter(b =>
    b.toLowerCase().includes(brandSearch.trim().toLowerCase())
  );

  return (
    <aside className="sidebar">
      <div className="filter-group">
        <h3>Layout</h3>
        <div>
          {LAYOUTS.map(item => (
            <label className="check-row" key={item}>
              <input
                type="checkbox"
                checked={layoutFilters.includes(item)}
                onChange={() => onToggleLayout(item)}
              />
              <span className="row-label"><span>{item}</span></span>
            </label>
          ))}
        </div>
      </div>

      <div className="filter-group">
        <h3>Switch Type</h3>
        <div>
          {SWITCH_TYPES.map(item => (
            <label className="check-row" key={item}>
              <input
                type="checkbox"
                checked={switchFilters.includes(item)}
                onChange={() => onToggleSwitch(item)}
              />
              <span className="row-label">
                <span className="swatch" style={{ background: SWITCH_COLORS[item] }}></span>
                <span>{item}</span>
              </span>
            </label>
          ))}
        </div>
      </div>

      <div className="filter-group">
        <h3>Brand</h3>
        <input
          type="text"
          className="brand-search"
          placeholder="Search brands..."
          value={brandSearch}
          onChange={e => onBrandSearchChange(e.target.value)}
        />

          {visibleBrands.length === 0 ? (
            <div className="no-brand-match">No brands match your search.</div>
          ) : (
            visibleBrands.map(brand => (
              <label className="check-row" key={brand}>
                <input
                  type="checkbox"
                  checked={brandFilters.includes(brand)}
                  onChange={() => onToggleBrand(brand)}
                />
                <span className="row-label">{brand}</span>
                <span className="count-pill">{brandCounts[brand] || 0}</span>
              </label>
            ))

/* ---------------------------------------------------

--------------------------------------------------- */

function ProductModal({ kb, onClose, onAddToCart, currency }) {
  useEffect(() => {
    function onKey(e) { if (e.key === "Escape") onClose(); }
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onClose]);

  return (
    <div className="modal-overlay open" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <button className="modal-close" onClick={onClose}>✕</button>
        <div className={`modal-visual${kb.imageUrl ? "" : " placeholder"}`}>
          {kb.imageUrl ? (
            <img className="modal-img" src={kb.imageUrl} alt={kb.name} />
          ) : (
            <React.Fragment>
              <span className="switch-dot" style={{ background: SWITCH_COLORS[kb.switchType] }}></span>
              <div className="keycap-illustration"><span className="legend">{kb.layout}</span></div>
            </React.Fragment>
          )}

        <div className="modal-body">
          <div className="modal-brand">{kb.brand}</div>
          <div className="modal-title">{kb.name}</div>

          <div className="spec-grid">

            {kb.features.map((f, i) => <li key={i}>{f}</li>)}
          </ul>

            <span className="modal-price">{formatPrice(kb.price, currency)}</span>
            <button className="add-cart-btn" onClick={() => onAddToCart(kb)}>Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------
   5. CART / CHECKOUT FLOW
--------------------------------------------------- */

const CHECKOUT_STEPS = [
  { key: "cart", label: "Cart" },
  { key: "info", label: "Info" },
  { key: "payment", label: "Payment" },
  { key: "confirmation", label: "Done" }
];

function StepsIndicator({ current }) {
  const order = CHECKOUT_STEPS.map(s => s.key);
  const currentIndex = order.indexOf(current);
  return (
    <div className="checkout-steps">
      {CHECKOUT_STEPS.map((s, i) => {
        let cls = "checkout-step";
        let dotContent = i + 1;
        if (i < currentIndex) { cls += " done"; dotContent = "✓"; }
        if (i === currentIndex) cls += " active";
        return (
          <React.Fragment key={s.key}>
            <div className={cls}><div className="dot">{dotContent}</div>{s.label}</div>
            {i < CHECKOUT_STEPS.length - 1 && <div className="checkout-step-line"></div>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function CartStepContent({
  lines, total, shippingCost, surveyCompleted, currency,
  onInc, onDec, onRemove, onContinueShopping, onProceed, onOpenSurvey
}) {
  return (
    <React.Fragment>
      <StepsIndicator current="cart" />
      <div className="checkout-title">Your Cart</div>
      {lines.length === 0 ? (
        <div className="cart-empty">Your cart is empty. Add a keyboard to get started.</div>
      ) : (
        lines.map(line => (
          <div className="cart-line" key={line.kb.id}>
            <div className="cart-line-visual">
              {line.kb.imageUrl ? (
                <img src={line.kb.imageUrl} alt={line.kb.name} />
              ) : (
                <span className="legend" style={{ fontFamily: "var(--mono)", fontSize: "10px", color: "var(--muted)" }}>
                  {line.kb.layout}
                </span>
              )}
            </div>
            <div className="cart-line-info">
              <div className="cart-line-name">{line.kb.name}</div>
              <div className="cart-line-brand">{line.kb.brand}</div>
            </div>
            <div className="qty-control">
              <button className="qty-btn" onClick={() => onDec(line.kb.id)}>−</button>
              <span className="qty-value">{line.qty}</span>
              <button className="qty-btn" onClick={() => onInc(line.kb.id)}>+</button>
            </div>
            <div className="cart-line-price">{formatPrice(line.kb.price * line.qty, currency)}</div>
            <button className="remove-line" aria-label="Remove" onClick={() => onRemove(line.kb.id)}>✕</button>
          </div>
        ))
      )}

      {lines.length > 0 && (
        <React.Fragment>
          {surveyCompleted ? (
            <div className="survey-applied-note">✓ Free shipping applied - thanks for your feedback!</div>
          ) : (
            <button type="button" className="survey-banner" onClick={onOpenSurvey}>
              🎁 Take our 60-second survey and get <strong>free shipping</strong> on this order →
            </button>
          )}

          <div className="summary-rows">
            <div className="summary-row">
              <span>Subtotal</span>
              <span>{formatPrice(total, currency)}</span>
            </div>
            <div className="summary-row">
              <span>Shipping</span>
              <span className={surveyCompleted ? "free-shipping" : ""}>
                {surveyCompleted ? "FREE" : formatPrice(shippingCost, currency)}
              </span>
            </div>
            <div className="summary-row grand">
              <span>Total</span>
              <span>{formatPrice(total + shippingCost, currency)}</span>
            </div>
          </div>
        </React.Fragment>
      )}

      <div className="checkout-actions">
        <button className="btn-secondary" onClick={onContinueShopping}>Continue Shopping</button>
        <button
          className="add-cart-btn"
          onClick={onProceed}
          disabled={lines.length === 0}
          style={lines.length === 0 ? { opacity: 0.4, cursor: "not-allowed" } : {}}
        >
          Proceed to Checkout →
        </button>
      </div>
    </React.Fragment>
  );
}

function InfoStepContent({ onBack, onNext }) {

    e.preventDefault();
    onNext();
  }
  return (
    <React.Fragment>
      <StepsIndicator current="info" />

        <div className="form-field">
          <label>Email</label>
          <input type="email" required placeholder="jane@example.com" />
        </div>
        <div className="form-field">
          <label>Shipping Address</label>
          <input type="text" required placeholder="123 Main St, Ottawa, ON" />
        </div>
        <div className="checkout-actions">
          <button type="button" className="btn-secondary" onClick={onBack}>← Back to Cart</button>
          <button type="submit" className="add-cart-btn">Continue to Payment →</button>
        </div>
      </form>
    </React.Fragment>
  );
}

function PaymentStepContent({ total, shippingCost, surveyCompleted, currency, onBack, onPay }) {
  const grandTotal = total + shippingCost;

  function handleSubmit(e) {
    e.preventDefault();
    onPay();
  }
  return (
    <React.Fragment>
      <StepsIndicator current="payment" />
      <div className="checkout-title">Payment</div>
      <div className="card-type-note">💳 Credit card only</div>
      <form onSubmit={handleSubmit}>
        <div className="form-field">
          <label>Name on Card</label>
          <input type="text" required placeholder="Jane Appleseed" />
        </div>
        <div className="form-field">
          <label>Card Number</label>
          <input type="text" required maxLength={19} placeholder="4111 1111 1111 1111" />
        </div>
        <div className="form-row">
          <div className="form-field">
            <label>Expiry (MM/YY)</label>
            <input type="text" required maxLength={5} placeholder="08/28" />
          </div>
          <div className="form-field">
            <label>CVV</label>
            <input type="text" required maxLength={4} placeholder="123" />
          </div>
        </div>

        <div className="summary-rows">
          <div className="summary-row">
            <span>Subtotal</span>
            <span>{formatPrice(total, currency)}</span>
          </div>
          <div className="summary-row">
            <span>Shipping</span>
            <span className={surveyCompleted ? "free-shipping" : ""}>
              {surveyCompleted ? "FREE" : formatPrice(shippingCost, currency)}
            </span>
          </div>
          <div className="summary-row grand">
            <span>Total Due</span>
            <span>{formatPrice(grandTotal, currency)}</span>
          </div>
        </div>

        <div className="checkout-actions">
          <button type="button" className="btn-secondary" onClick={onBack}>← Back</button>
          <button type="submit" className="add-cart-btn">Pay {formatPrice(grandTotal, currency)}</button>
        </div>
      </form>
    </React.Fragment>
  );
}

function ConfirmationStepContent({ orderNumber, orderSubtotal, orderShipping, orderTotal, currency, onDone }) {
  return (
    <React.Fragment>
      <StepsIndicator current="confirmation" />
      <div className="confirmation">
        <div className="check-icon">✓</div>
        <h2>Order Confirmed!</h2>
        <p>Thanks for your purchase. A confirmation email is on its way.</p>
        <p>Order number: <span className="order-number">{orderNumber}</span></p>
        <div className="confirmation-summary">
          <div className="row"><span>Payment method</span><span>Credit card</span></div>
          <div className="row"><span>Subtotal</span><span>{formatPrice(orderSubtotal, currency)}</span></div>
          <div className="row">
            <span>Shipping</span>
            <span>{orderShipping === 0 ? "FREE" : formatPrice(orderShipping, currency)}</span>
          </div>
          <div className="row total"><span>Total paid</span><span>{formatPrice(orderTotal, currency)}</span></div>
        </div>
        <button className="add-cart-btn" onClick={onDone}>Continue Shopping</button>
      </div>
    </React.Fragment>
  );
}

function CartModal({
  step, lines, total, shippingCost, surveyCompleted, currency, onClose,
  onInc, onDec, onRemove, onContinueShopping, onProceedToInfo, onOpenSurvey,
  onBackToCart, onProceedToPayment, onBackToInfo, onPay,
  orderNumber, orderSubtotal, orderShipping, orderTotal, onDone
}) {
  useEffect(() => {
    function onKey(e) { if (e.key === "Escape") onClose(); }
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onClose]);

  return (
    <div className="modal-overlay open" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal checkout-modal">
        <button className="modal-close" onClick={onClose}>✕</button>
        <div className="checkout-body">
          {step === "cart" && (
            <CartStepContent
              lines={lines} total={total} shippingCost={shippingCost} surveyCompleted={surveyCompleted} currency={currency}
              onInc={onInc} onDec={onDec} onRemove={onRemove}
              onContinueShopping={onContinueShopping} onProceed={onProceedToInfo} onOpenSurvey={onOpenSurvey}
            />
          )}
          {step === "info" && (
            <InfoStepContent onBack={onBackToCart} onNext={onProceedToPayment} />
          )}
          {step === "payment" && (
            <PaymentStepContent
              total={total} shippingCost={shippingCost} surveyCompleted={surveyCompleted} currency={currency}
              onBack={onBackToInfo} onPay={onPay}
            />
          )}
          {step === "confirmation" && (
            <ConfirmationStepContent
              orderNumber={orderNumber} orderSubtotal={orderSubtotal}
              orderShipping={orderShipping} orderTotal={orderTotal} currency={currency} onDone={onDone}
            />
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------
   5.5 SURVEY (post-visit / post-purchase feedback)
--------------------------------------------------- */

function SurveyModal({ onClose, onSubmit }) {
  const [rating, setRating] = useState(0);
  const [findEase, setFindEase] = useState("");
  const [comments, setComments] = useState("");

  useEffect(() => {
    function onKey(e) { if (e.key === "Escape") onClose(); }
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onClose]);

  const canSubmit = rating > 0 && findEase !== "";

  function handleSubmit(e) {
    e.preventDefault();
    if (!canSubmit) return;
    onSubmit();
  }

  return (
    <div className="modal-overlay open" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <button className="modal-close" onClick={onClose}>✕</button>
        <div className="survey-body">
          <div className="survey-badge">🎁 Quick Survey</div>
          <div className="checkout-title">Tell us about your visit</div>
          <p className="survey-intro">
            Takes about 60 seconds. Complete it and we'll cover your shipping - free, on us,
            on this order.
          </p>
          <form onSubmit={handleSubmit}>
            <div className="form-field">
              <label>How would you rate your shopping experience so far?</label>
              <div className="star-row">
                {[1, 2, 3, 4, 5].map(n => (
                  <button
                    type="button"
                    key={n}
                    className={`star-btn${n <= rating ? " filled" : ""}`}
                    onClick={() => setRating(n)}
                    aria-label={`${n} star${n > 1 ? "s" : ""}`}
                  >★</button>
                ))}
              </div>
            </div>

            <div className="form-field">
              <label>How easy was it to find a keyboard you liked?</label>
              <div className="radio-row">
                {["Very easy", "Easy", "Neutral", "Difficult"].map(opt => (
                  <label className="radio-chip" key={opt}>
                    <input
                      type="radio"
                      name="findEase"
                      checked={findEase === opt}
                      onChange={() => setFindEase(opt)}
                    />
                    {opt}
                  </label>
                ))}
              </div>
            </div>

            <div className="form-field">
              <label>Anything else you'd like us to know? (optional)</label>
              <textarea
                rows="3"
                value={comments}
                onChange={e => setComments(e.target.value)}
                placeholder="Tell us what you loved, or what we could improve..."
              ></textarea>
            </div>

            <div className="checkout-actions">
              <button type="button" className="btn-secondary" onClick={onClose}>Not now</button>
              <button
                type="submit"
                className="add-cart-btn"
                disabled={!canSubmit}
                style={!canSubmit ? { opacity: 0.4, cursor: "not-allowed" } : {}}
              >
                Submit &amp; Unlock Free Shipping →
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------
   6. HEADER
--------------------------------------------------- */

function Header({ cartCount, theme, onToggleTheme, onOpenCart, onOpenSurvey, currency, onToggleCurrency }) {
  return (
    <header className="topbar">
      <div className="brandmark">
        <span className="key">⌨</span>
        KeebStudio <span className="studio">/ boards for people who care</span>
      </div>
      <div className="topbar-right">
        <button className="survey-promo" onClick={onOpenSurvey}>
          🎁 <span><strong>Free shipping</strong> for feedback</span>
        </button>
        <button className="theme-toggle" onClick={onToggleCurrency}>
          {currency === "USD" ? "🇺🇸 USD" : "🇨🇦 CAD"}
        </button>
        <button className="theme-toggle" onClick={onToggleTheme}>
          {theme === "light" ? "☀️ Light" : "🌙 Dark"}
        </button>
        <button className="cart-btn" aria-label="Open cart" onClick={onOpenCart}>
          🛒 <span className="cart-count">{cartCount}</span>
        </button>
      </div>
    </header>
  );
}

/* ---------------------------------------------------
   7. APP ROOT
--------------------------------------------------- */

function App() {
  const [theme, setTheme] = useState("dark");
  const [layoutFilters, setLayoutFilters] = useState([]);
  const [switchFilters, setSwitchFilters] = useState([]);
  const [brandFilters, setBrandFilters] = useState([]);
  const [brandSearch, setBrandSearch] = useState("");
  const [selectedId, setSelectedId] = useState(null);
  const [cart, setCart] = useState({});
  const [cartOpen, setCartOpen] = useState(false);
  const [checkoutStep, setCheckoutStep] = useState("cart");
  const [order, setOrder] = useState({ number: "", subtotal: 0, shipping: 0, total: 0 });
  const [toastMsg, setToastMsg] = useState("");
  const [toastShow, setToastShow] = useState(false);
  const [surveyOpen, setSurveyOpen] = useState(false);
  const [surveyCompleted, setSurveyCompleted] = useState(false);
  const [currency, setCurrency] = useState("CAD");
  const toastTimer = useRef(null);

  const SHIPPING_FEE = 20;
  const shippingCost = surveyCompleted ? 0 : SHIPPING_FEE;

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);

  function toggleInArray(arr, item) {
    return arr.includes(item) ? arr.filter(x => x !== item) : [...arr, item];
  }

  const toggleLayout = item => setLayoutFilters(prev => toggleInArray(prev, item));
  const toggleSwitch = item => setSwitchFilters(prev => toggleInArray(prev, item));
  const toggleBrand = item => setBrandFilters(prev => toggleInArray(prev, item));

  function clearFilters() {
    setLayoutFilters([]);
    setSwitchFilters([]);
    setBrandFilters([]);
    setBrandSearch("");
  }

  const filteredKeyboards = useMemo(() => {
    return KEYBOARDS.filter(kb => {
      const layoutOk = layoutFilters.length === 0 || layoutFilters.includes(kb.layout);
      const switchOk = switchFilters.length === 0 || switchFilters.includes(kb.switchType);
      const brandOk = brandFilters.length === 0 || brandFilters.includes(kb.brand);
      return layoutOk && switchOk && brandOk;
    });
  }, [layoutFilters, switchFilters, brandFilters]);

  // brand counts reflect layout + switch filters only (not brand selection itself)
  const brandCounts = useMemo(() => {
    const preBrandFiltered = KEYBOARDS.filter(kb => {
      const layoutOk = layoutFilters.length === 0 || layoutFilters.includes(kb.layout);
      const switchOk = switchFilters.length === 0 || switchFilters.includes(kb.switchType);
      return layoutOk && switchOk;
    });
    const counts = {};
    preBrandFiltered.forEach(kb => { counts[kb.brand] = (counts[kb.brand] || 0) + 1; });
    return counts;
  }, [layoutFilters, switchFilters]);

  function showToast(msg) {
    setToastMsg(msg);
    setToastShow(true);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastShow(false), 2200);
  }

  function addToCart(kb) {
    setCart(prev => ({ ...prev, [kb.id]: (prev[kb.id] || 0) + 1 }));
    showToast(`${kb.name} added to cart`);
  }

  function setQty(id, qty) {
    setCart(prev => {
      const next = { ...prev };
      if (qty <= 0) delete next[id];
      else next[id] = qty;
      return next;
    });
  }

  const cartLines = useMemo(() => {
    return Object.keys(cart).map(id => {
      const kb = KEYBOARDS.find(k => k.id === Number(id));
      return kb ? { kb, qty: cart[id] } : null;
    }).filter(Boolean);
  }, [cart]);

  const cartTotal = cartLines.reduce((sum, line) => sum + line.kb.price * line.qty, 0);
  const cartCount = Object.values(cart).reduce((sum, qty) => sum + qty, 0);

  function openCart() {
    setCheckoutStep("cart");
    setCartOpen(true);
  }
  function closeCart() { setCartOpen(false); }

  function handlePay() {
    const orderNumber = "KS-" + Math.floor(100000 + Math.random() * 900000);
    setOrder({
      number: orderNumber,
      subtotal: cartTotal,
      shipping: shippingCost,
      total: cartTotal + shippingCost
    });
    setCheckoutStep("confirmation");
    setCart({});
  }

  function openSurvey() { setSurveyOpen(true); }
  function closeSurvey() { setSurveyOpen(false); }
  function submitSurvey() {
    setSurveyCompleted(true);
    setSurveyOpen(false);
    showToast("Thanks for your feedback! Free shipping unlocked 🎉");
  }

  const selectedKb = selectedId ? KEYBOARDS.find(k => k.id === selectedId) : null;

  return (
    <React.Fragment>
      <Header
        cartCount={cartCount}
        theme={theme}
        onToggleTheme={() => setTheme(t => (t === "light" ? "dark" : "light"))}
        onOpenCart={openCart}
        onOpenSurvey={openSurvey}
        currency={currency}
        onToggleCurrency={() => setCurrency(c => (c === "CAD" ? "USD" : "CAD"))}
      />

      <div className="layout">
        <Sidebar
          layoutFilters={layoutFilters}
          switchFilters={switchFilters}
          brandFilters={brandFilters}
          brandSearch={brandSearch}
          brandCounts={brandCounts}
          onToggleLayout={toggleLayout}
          onToggleSwitch={toggleSwitch}
          onToggleBrand={toggleBrand}
          onBrandSearchChange={setBrandSearch}
          onClear={clearFilters}
        />

        <main className="content">
          <div className="content-header">
            <h1>Mechanical Keyboards</h1>
            <div className="result-count">
              {filteredKeyboards.length} {filteredKeyboards.length === 1 ? "board" : "boards"}
            </div>
          </div>
          <div className="grid">
            {filteredKeyboards.length === 0 ? (
              <div className="empty-state">No keyboards match your filters. Try clearing a few.</div>
            ) : (
              filteredKeyboards.map(kb => (
                <ProductCard key={kb.id} kb={kb} onSelect={setSelectedId} currency={currency} />
              ))
            )}
          </div>
        </main>
      </div>

      {selectedKb && (
        <ProductModal
          kb={selectedKb}
          onClose={() => setSelectedId(null)}
          onAddToCart={addToCart}
          currency={currency}
        />
      )}

      {cartOpen && (
        <CartModal
          step={checkoutStep}
          lines={cartLines}
          total={cartTotal}
          shippingCost={shippingCost}
          surveyCompleted={surveyCompleted}
          currency={currency}
          onClose={closeCart}
          onInc={id => setQty(id, (cart[id] || 0) + 1)}
          onDec={id => setQty(id, (cart[id] || 0) - 1)}
          onRemove={id => setQty(id, 0)}
          onContinueShopping={closeCart}
          onProceedToInfo={() => setCheckoutStep("info")}
          onOpenSurvey={openSurvey}
          onBackToCart={() => setCheckoutStep("cart")}
          onProceedToPayment={() => setCheckoutStep("payment")}
          onBackToInfo={() => setCheckoutStep("info")}
          onPay={handlePay}
          orderNumber={order.number}
          orderSubtotal={order.subtotal}
          orderShipping={order.shipping}
          orderTotal={order.total}
          onDone={closeCart}
        />
      )}

      {surveyOpen && (
        <SurveyModal onClose={closeSurvey} onSubmit={submitSurvey} />
      )}

      <div className={`toast${toastShow ? " show" : ""}`}>{toastMsg}</div>
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
