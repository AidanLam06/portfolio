<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Big Mac Index Dashboard</title>

<style>
/* ---- Fonts (system-stack fallback first, web fonts progressively enhance) ---- */
@font-face {
  font-family: 'Fraunces-fallback';
  src: local('Georgia');
}
:root{
  --ink:#b63838;
  --panel:#fff1cd;
  --panel-2:#EDE6D3;
  --gold:#f3bc3a;
  --gold-soft:#E4C878;
  --teal:#1ee4c9;
  --line:#D8CFB4;
  --muted:#d3b051;
  --font-display: 'Bricolage Grotesque', 'Fraunces', Georgia, serif;
  --font-mono: 'DM Mono', Courier, monospace;
  --font-body: 'Plus Jakarta Sans', 'Inter', sans-serif;
}
*{ box-sizing: border-box; }
html,body{ margin:0; padding:0; background:var(--ink); }
body{ font-family: var(--font-body); }
.grain{
  min-height:100vh;
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
  background-size: 3px 3px;
}
::selection{ background: var(--gold-soft); color:#b63838; }
select{ -webkit-appearance:none; appearance:none; }
button{ font-family: inherit; cursor:pointer; }

/* ---- Layout ---- */
.page{ min-height:100vh; }
.header{ max-width:72rem; margin:0 auto; padding: 40px 24px 24px; }
.header-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:24px; flex-wrap:wrap; }
.eyebrow{ font-family: var(--font-mono); font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color: var(--gold-soft); margin: 0 0 12px; }
.title{ font-family: var(--font-display); font-weight:600; font-size: clamp(1.9rem, 4vw, 3rem); color: var(--panel); line-height:1.05; max-width:38rem; margin:0; }
.subtitle{ font-size:14px; color: rgba(246,242,231,0.6); max-width:32rem; margin:12px 0 0; line-height:1.5; }

/* ---- Language toggle ---- */
.lang-toggle{
  position:relative; display:flex; align-items:center; gap:4px;
  font-family: var(--font-mono); font-size:12px; letter-spacing:0.03em;
  background: var(--panel-2); border-radius:999px; padding:4px; border:1px solid var(--line);
}
.lang-opt{ padding:6px 14px; border-radius:999px; color: var(--muted); transition: all .2s ease; }
.lang-opt.active{ background: var(--ink); color: var(--gold-soft); }

/* ---- Ticker ---- */
.ticker-wrap{ overflow:hidden; border-top:1px solid rgba(255,255,255,0.08); border-bottom:1px solid rgba(255,255,255,0.08); background:#8a2525; }
.ticker-track{ display:flex; white-space:nowrap; padding:8px 0; width:max-content; animation: ticker 26s linear infinite; }
.ticker-track:hover{ animation-play-state: paused; }
@keyframes ticker{ 0%{ transform: translateX(0); } 100%{ transform: translateX(-50%); } }
.ticker-item{ font-family: var(--font-mono); font-size:12px; color: var(--gold-soft); margin: 0 24px; display:flex; align-items:center; gap:8px; }
.ticker-country{ color: rgba(255,255,255,0.4); }
.ticker-price{ color:#fff; }

/* ---- Grid / cards ---- */
.grid{ max-width:72rem; margin:0 auto; padding:32px 24px; display:grid; grid-template-columns: repeat(3, 1fr); gap:24px; }
.card{ background: var(--panel); border-radius:8px; padding:24px; box-shadow: 0 20px 40px -12px rgba(0,0,0,0.35); }
.card-bar{ grid-column: span 2; }
.card-stats{ background: var(--ink); border:1px solid rgba(255,255,255,0.08); display:flex; flex-direction:column; justify-content:space-between; box-shadow:none; }
.card-line{ grid-column: span 3; }
.card-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; gap:12px; }
.card-head.wrap{ flex-wrap:wrap; align-items:center; gap:16px; }
.card-title{ font-family: var(--font-display); font-weight:600; font-size:1.25rem; color: var(--ink); margin:0; }
.card-sub{ font-family: var(--font-mono); font-size:11px; color: var(--muted); white-space:nowrap; }
.chart-box{ height:288px; margin-top:16px; position:relative; }

/* ---- Stats card ---- */
.stat-block{ }
.stat-label{ font-family: var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color: var(--muted); margin:0; }
.stat-country{ font-family: var(--font-display); font-weight:600; font-size:1.4rem; color:#fff; margin:4px 0 0; }
.stat-value{ font-family: var(--font-mono); font-size:14px; color:#fff; margin:2px 0 0; }
.stat-value.gold{ color: var(--gold-soft); }
.stat-value.teal{ color: var(--teal); }
.stat-divider{ height:1px; background: rgba(255,255,255,0.08); margin:18px 0; }

/* ---- Select ---- */
.select-wrap{ display:flex; align-items:center; gap:12px; }
.select-label{ font-family: var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color: var(--muted); }
.select-box{ position:relative; }
.select{ font-family: var(--font-mono); font-size:13px; background: var(--panel-2); border:1px solid var(--line); border-radius:3px; padding:8px 30px 8px 12px; color: var(--ink); }
.select:focus{ outline:2px solid var(--gold); outline-offset:1px; }
.select-caret{ position:absolute; right:10px; top:50%; transform: translateY(-50%); color: var(--muted); font-size:11px; pointer-events:none; }

/* ---- Change row ---- */
.change-row{ display:flex; align-items:center; gap:8px; margin-top:12px; }
.change-label{ font-family: var(--font-mono); font-size:11px; color: var(--muted); }
.change-value{ font-family: var(--font-mono); font-size:14px; }
.change-value.teal{ color: var(--teal); }
.change-value.gold{ color: var(--gold); }

/* ---- Footer ---- */
.footer{ max-width:72rem; margin:0 auto; padding:8px 24px 40px; }
.source{ font-family: var(--font-mono); font-size:11px; color: rgba(246,242,231,0.4); margin:0; }

/* ---- Responsive ---- */
@media (max-width: 900px){
  .card-bar, .card-line, .card-stats{ grid-column: span 1; }
  .grid{ grid-template-columns: 1fr; }
}
</style>
